<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ask a question in plain English and get an answer, a result table and the SQL behind it - with nothing changed without your approval.">
    <title>Autonomous SQL Agent</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/tokens.css?v=1">
    <link rel="stylesheet" href="/static/css/base.css?v=1">
    <link rel="stylesheet" href="/static/css/layout.css?v=1">
    <link rel="stylesheet" href="/static/css/components.css?v=1">
</head>
<body>
    <a href="#chat-panel" class="visually-hidden">Skip to the question box</a>

    <!-- The AI-interaction notice. EU AI Act Art. 50(1) requires users to be
         informed they are interacting with an AI system, and Art. 50(5)
         requires that it be clear and distinguishable at the time of the
         first interaction. -->
    <div class="ai-notice" role="note">
        <span class="ai-notice__badge" aria-hidden="true">AI</span>
        <span class="ai-notice__text">
            Answers here are written by an AI model, which can misread a question.
            Every answer shows the query it ran so you can check it.
        </span>
    </div>

    <div class="app" id="app">

        <!-- ================= Top bar ================= -->
        <header class="topbar">
            <div class="topbar__brand">
                <span class="topbar__mark" aria-hidden="true">S</span>
                <span>SQL Agent</span>
            </div>

            <span class="topbar__sep" aria-hidden="true"></span>

            <button type="button" class="conn-chip" id="conn-chip" title="No database connected">
                <span class="conn-chip__dot" aria-hidden="true"></span>
                <span id="conn-label">Not connected</span>
            </button>

            <div class="topbar__spacer"></div>

            <div class="topbar__actions">
                <button type="button" class="btn btn--primary" id="connect-btn">
                    Connect a database
                </button>
                <button
                    type="button"
                    class="btn btn--ghost btn--icon tip"
                    id="theme-btn"
                    data-tip="Switch between dark and light"
                    aria-label="Switch between dark and light theme"
                ></button>
            </div>
        </header>

        <!-- ================= Main ================= -->
        <div class="main">

            <!-- ---- Activity rail ---- -->
            <nav class="rail" aria-label="Panels">
                <div class="rail__group">
                    <button
                        type="button"
                        class="rail__btn tip tip--right"
                        id="rail-explorer"
                        data-tip="Database explorer  (Ctrl+B)"
                        aria-label="Toggle the database explorer"
                        aria-pressed="true"
                    ></button>
                    <button
                        type="button"
                        class="rail__btn tip tip--right"
                        id="rail-chat"
                        data-tip="Conversation  (Ctrl+J)"
                        aria-label="Toggle the conversation panel"
                        aria-pressed="true"
                    ></button>
                </div>

                <div class="rail__group">
                    <button
                        type="button"
                        class="rail__btn tip tip--right"
                        data-tip="Keyboard shortcuts"
                        aria-label="Keyboard shortcuts"
                    ></button>
                </div>
            </nav>

            <!-- ---- Left panel: schema explorer ---- -->
            <aside class="panel panel--left" id="left-panel" aria-label="Database explorer">
                <div class="panel__header">
                    <span class="panel__title">Database</span>
                    <div class="grid__spacer"></div>
                    <button
                        type="button"
                        class="btn btn--ghost btn--sm btn--icon"
                        id="explorer-refresh"
                        title="Reload the schema"
                        aria-label="Reload the schema"
                    ></button>
                </div>
                <div class="panel__body" id="explorer"></div>
            </aside>

            <div class="splitter splitter--v" id="split-left" role="separator" aria-orientation="vertical"></div>

            <!-- ---- Centre: SQL and results ---- -->
            <main class="panel panel--center" aria-label="Query and results">
                <div class="workspace">
                    <div class="tabs" id="tab-bar" role="tablist" aria-label="Open queries"></div>

                    <div class="ws-split">
                        <section class="ws-pane ws-pane--sql" aria-label="Generated SQL">
                            <div class="panel__header">
                                <span class="panel__title">SQL</span>
                            </div>
                            <div class="panel__body" id="sql-body"></div>
                        </section>

                        <section class="ws-pane ws-pane--data" aria-label="Query results">
                            <div class="panel__header">
                                <span class="panel__title">Results</span>
                            </div>
                            <div id="chart-slot"></div>
                            <div class="panel__body" id="data-body" style="display:flex; flex-direction:column"></div>
                            <div class="panel__empty" id="data-empty"></div>
                        </section>
                    </div>
                </div>
            </main>

            <div class="splitter splitter--v" id="split-right" role="separator" aria-orientation="vertical"></div>

            <!-- ---- Right panel: conversation ---- -->
            <aside class="panel panel--right" id="right-panel" aria-label="Conversation">
                <div class="panel__header">
                    <span class="panel__title">Ask</span>
                    <div class="grid__spacer"></div>
                    <button
                        type="button"
                        class="btn btn--ghost btn--sm btn--icon tip tip--right"
                        id="export-conversation"
                        data-tip="Export this conversation"
                        aria-label="Export this conversation"
                    ></button>
                </div>
                <div class="chat" id="chat-panel"></div>
            </aside>
        </div>

        <!-- ================= Status bar ================= -->
        <footer class="statusbar">
            <span class="statusbar__item" id="status-connection">Not connected</span>
            <span class="statusbar__item" id="status-rows"></span>
            <span class="statusbar__spacer"></span>
            <span class="statusbar__item" id="status-timing"></span>
            <span class="statusbar__item" id="status-mode">Autonomous</span>
        </footer>
    </div>

    <!-- ================= Connection wizard ================= -->
    <div class="modal" id="wizard-modal" role="dialog" aria-modal="true" aria-labelledby="wizard-title">
        <div class="modal__panel">
            <div class="modal__head">
                <div class="modal__head-text">
                    <h2 class="modal__title" id="wizard-title">Connect a database</h2>
                    <p class="modal__subtitle"></p>
                </div>
                <button
                    type="button"
                    class="btn btn--ghost btn--icon"
                    id="wizard-close"
                    title="Close"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal__body"></div>
            <div class="modal__foot"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script type="module" src="/static/js/app.js?v=1"></script>
</body>
</html>
