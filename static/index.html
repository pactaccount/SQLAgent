<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous SQL Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        /* Modal Styles */
        .modal {
            display: none; 
            position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 30px;
            width: 400px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal h2 { margin-bottom: 20px; font-size: 1.5rem;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem;}
        .form-group input { 
            width: 100%; padding: 10px; border-radius: 6px; 
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); 
            color: white; font-family: monospace;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;}
        .btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; border: none; }
        .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--glass-border); }
        .btn-save { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; }
        .btn-save:hover { box-shadow: 0 0 15px var(--primary-glow); }
        .settings-btn { background: transparent; border: 1px solid var(--glass-border); color: white; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display:flex; align-items:center; justify-content:center; transition: all 0.2s;}
        .settings-btn:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Database Connection</h2>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:15px;">Configure your tenant and database type.</p>
            
            <div class="form-group">
                <label>Tenant ID (Optional)</label>
                <input type="text" id="tenant-id-input" placeholder="default_tenant">
            </div>

            <div class="form-group">
                <label>Database Type</label>
                <select id="db-type-select" style="width: 100%; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; font-family: monospace;" onchange="toggleDbFields()">
                    <option value="sqlite">SQLite (Local)</option>
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mysql">MySQL</option>
                    <option value="snowflake">Snowflake</option>
                </select>
            </div>

            <!-- SQLite Fields -->
            <div id="fields-sqlite" class="db-fields-group">
                <div class="form-group">
                    <label>Upload Database File (.sqlite, .db)</label>
                    <input type="file" id="sqlite-upload" accept=".sqlite,.sqlite3,.db" onchange="uploadSQLiteFile(event)" style="background: rgba(255,255,255,0.05); padding: 5px;">
                </div>
                <div class="form-group" style="display:none;" id="sqlite-path-group">
                    <label>Internal Uploaded Path</label>
                    <input type="text" id="sqlite-path" placeholder="Will auto-populate after upload" readonly style="color:#aaa;">
                </div>
                <p id="upload-status" style="color:var(--primary); font-size: 0.8rem; display:none;">Uploading...</p>
            </div>

            <!-- Standard SQL Fields (Postgres / MySQL) -->
            <div id="fields-standard" class="db-fields-group" style="display:none;">
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:2;">
                        <label>Host</label>
                        <input type="text" id="std-host" placeholder="localhost or db.cloud.com">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Port</label>
                        <input type="text" id="std-port" placeholder="5432">
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;">
                        <label>Username</label>
                        <input type="text" id="std-user" placeholder="admin">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Password</label>
                        <input type="password" id="std-pass" placeholder="••••••••">
                    </div>
                </div>
                <div class="form-group">
                    <label>Database Name</label>
                    <input type="text" id="std-dbname" placeholder="my_database">
                </div>
            </div>

            <!-- Snowflake Fields -->
            <div id="fields-snowflake" class="db-fields-group" style="display:none;">
                <div class="form-group">
                    <label>Account Identifier</label>
                    <input type="text" id="sf-account" placeholder="orgname-accountname">
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;">
                        <label>Username</label>
                        <input type="text" id="sf-user" placeholder="admin">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Password</label>
                        <input type="password" id="sf-pass" placeholder="••••••••">
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <div class="form-group" style="flex:1;">
                        <label>Database</label>
                        <input type="text" id="sf-dbname" placeholder="REVENUE_DB">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Schema</label>
                        <input type="text" id="sf-schema" placeholder="PUBLIC">
                    </div>
                </div>
                <div class="form-group">
                    <label>Warehouse</label>
                    <input type="text" id="sf-warehouse" placeholder="COMPUTE_WH">
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-save" onclick="saveSettings()">Connect & Save</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <div class="ide-layout">
            <!-- Global Layout Controls -->
            <div class="layout-controls" style="position: absolute; top: 8px; right: 15px; z-index: 100;">
                <button onclick="toggleSidebar('left-sidebar')" title="Toggle Left Sidebar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg></button>
                <button onclick="toggleBottomPanel()" title="Toggle Bottom Panel"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="15" x2="21" y2="15"></line></svg></button>
                <button onclick="toggleSidebar('right-sidebar')" title="Toggle Right Sidebar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="15" y1="3" x2="15" y2="21"></line></svg></button>
            </div>

            <!-- Activity Bar (Far Left) -->
            <nav class="activity-bar">
                <div class="activity-top">
                    <button class="activity-btn active" title="Toggle Explorer" onclick="toggleSidebar('left-sidebar')">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    </button>
                    <button class="activity-btn" title="Toggle Chat" onclick="toggleSidebar('right-sidebar')">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </button>
                </div>
                <div class="activity-bottom">
                    <button class="activity-btn" onclick="toggleTheme()" title="Toggle Theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                    </button>
                    <div style="display:flex; justify-content:center; margin-bottom: 15px; margin-top: 15px;">
                        <span id="connection-indicator" class="indicator" style="background:var(--error); box-shadow:0 0 8px var(--error);"></span>
                    </div>
                    <button class="activity-btn" onclick="openSettings()" title="Settings">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </button>
                </div>
            </nav>

            <!-- Sidebar (Database Explorer) -->
            <aside class="sidebar" id="left-sidebar">
                <div class="panel-header" style="border-top:none; display:flex; justify-content:space-between;">
                    <span>EXPLORER</span>
                </div>
                <div class="panel-content" style="padding: 0;">
                    <ul id="schema-tree" class="tree-root">
                        <!-- Loaded dynamically -->
                    </ul>
                </div>
            </aside>
            
            <div class="splitter-vertical" id="split-1"></div>

            <!-- Center Workspace (SQL & Data) -->
            <main class="workspace" id="center-workspace">
                <div class="tab-bar" id="tab-bar">
                    <!-- Tabs injected by JS -->
                </div>
                
                <div class="panel sql-panel" id="sql-panel">
                    <div class="panel-content" id="sql-content-container">
                        <!-- Dynamic SQL Pre block injected by JS -->
                    </div>
                </div>
                
                <div class="splitter-horizontal" id="split-2"></div>
                
                <div class="panel data-panel" id="data-panel">
                    <div class="panel-tab" style="border-top:none;"><span id="data-header-title">OUTPUT</span> <span id="row-count" style="font-size:0.75rem; color:var(--text-muted); margin-left:10px;"></span></div>
                    <div class="panel-content table-container" id="data-content-container">
                        <!-- Dynamic Data Table injected by JS -->
                    </div>
                </div>
            </main>
            
            <div class="splitter-vertical" id="split-3"></div>

            <!-- Right Sidebar (Chat) -->
            <aside class="chat-sidebar" id="right-sidebar">
                <div class="panel-header" style="border-top:none; display:flex; justify-content:space-between; align-items:center;">
                    <span id="chat-header-title">CHAT</span>
                </div>
                <div class="chat-container" id="chat-container">
                    <!-- Chat messages injected by JS -->
                </div>

                <div class="input-area">
                    <form id="chat-form" class="cursor-chat-form">
                        <input type="text" id="user-input" placeholder="Ask a question..." autocomplete="off" required>
                        <button type="submit" id="send-btn" title="Send">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                        </button>
                    </form>
                </div>
            </aside>
        </div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/app.js?v=6"></script>
</body>
</html>
